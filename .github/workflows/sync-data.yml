name: Sync GitHub Data

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run GitHub data sync
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: "git791"
        run: node scripts/sync-github.mjs

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain src/data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/*.json
            git commit -m "chore(data): sync github commit ledger and repo facts [skip ci]"
            git push origin main
          else
            echo "No data changes detected. Everything is up to date."
          fi
